<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Generic playlist texture for floating screens. Rendered at 1200x700. */
  body { width: 1200px; height: 700px; background: var(--surface); font-family: var(--sans); color: var(--paper); box-sizing: border-box;
         padding: 50px 60px; border: 6px solid var(--line); }
  h1 { margin: 0 0 30px; font-size: 44px; font-weight: 800; }
  .r { display: flex; justify-content: space-between; font-size: 34px; padding: 14px 0; border-bottom: 2px solid var(--line); }
  .r span:last-child { font-family: var(--mono); color: var(--mid); }
  .now { color: var(--accent); }
</style>
<body><h1>AI Songs About AI</h1>
<div class="r now"><span>▶ Ghost in the Machine</span><span>3:10</span></div>
<div class="r"><span>Ghost in the Machine (Remix)</span><span>3:10</span></div>
<div class="r"><span>Machine Ghost</span><span>3:11</span></div>
<div class="r"><span>Ghosts in a Machine</span><span>3:10</span></div></body>
