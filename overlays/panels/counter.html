<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Generic dashboard counter texture. Rendered at 1200x700. */
  body { width: 1200px; height: 700px; background: var(--base); font-family: var(--mono); color: var(--mid);
         box-sizing: border-box; padding: 64px; border: 6px solid var(--line); }
  .label { font-size: 30px; letter-spacing: 0.1em; text-transform: uppercase; }
  .num { font-family: var(--sans); font-weight: 900; font-size: 120px; color: var(--paper); letter-spacing: -0.03em; margin: 30px 0; }
  .delta { color: var(--accent); font-size: 40px; }
  svg { margin-top: 30px; }
</style>

 points="0,170 120,160 240,150 360,152 480,120 600,110 720,80 840,60 960,30 1060,8"/></svg></body>
