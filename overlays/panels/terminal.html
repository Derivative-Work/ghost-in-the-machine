<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Generic terminal texture for floating screens. Rendered at 1200x700. */
  body { width: 1200px; height: 700px; background: var(--base); font-family: var(--mono); font-size: 30px;
         line-height: 1.6; color: var(--mid); box-sizing: border-box; padding: 52px; border: 6px solid var(--line); }
  .p { color: var(--accent); } .ok { color: var(--paper); }
</style>
<body>
  <div><span class="p">$</span> npm run song -- --mood=sad</div>
  <div>✓ loaded 1,402 reference songs</div>
  <div>✓ averaged chord progression</div>
  <div>✓ averaged lyrics</div>
  <div class="ok">✓ done in 0.04s</div>
  <div><span class="p">$</span> ▌</div>
</body>
