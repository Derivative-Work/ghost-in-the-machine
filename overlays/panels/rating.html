<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Generic response-rating texture for floating screens. Rendered at 1200x700. */
  body { width: 1200px; height: 700px; background: var(--base); font-family: var(--sans); color: var(--paper); box-sizing: border-box;
         padding: 60px; border: 6px solid var(--line); }
  .q { font-size: 46px; font-weight: 700; margin-bottom: 50px; }
  .row { display: flex; gap: 40px; }
  .b { font-size: 120px; padding: 30px 60px; border: 4px solid var(--line); border-radius: 30px; }
  .b.on { border-color: var(--accent-2); background: rgba(57,106,211,.25); }
  .n { font-family: var(--mono); font-size: 30px; color: var(--mid); margin-top: 40px; }
</style>
<body><div class="q">How was this response?</div><div class="row"><div class="b on">👍</div><div class="b">👎</div></div>
<div class="n">rated 9,406,832,711 times</div></body>
